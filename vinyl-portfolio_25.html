<!DOCTYPE html>
<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--surface:#0f0f0f;--surface2:#141414;--surface3:#1a1a1a;

  --gold:#b8962e;--gold2:#d4b257;--gold3:#f0d080;

  --green:#3d9e72;--red:#b85565;--blue:#5a8fc0;

}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.7}

.topbar{position:sticky;top:0;z-index:100;background:rgba(8,8,8,.95);backdrop-filter:blur(14px);border-bottom:0.5px solid var(--border);padding:11px 28px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--serif);font-size:21px;font-weight:300;color:var(--gold3);font-style:italic}

.t-user{font-size:11px;color:var(--muted2)}
.t-sync{font-size:10px;color:var(--muted);margin-left:auto}
.t-count{font-size:10px;color:var(--muted);padding:3px 10px;border:0.5px solid var(--border2);border-radius:2px}
.t-db{font-size:10px;padding:3px 10px;border-radius:2px;border:0.5px solid}
.t-db.ok{color:var(--green);border-color:var(--green)}
.t-db.err{color:var(--red);border-color:var(--red)}
.back-btn{font-size:11px;color:var(--muted2);cursor:pointer;border:0.5px solid var(--border2);padding:5px 12px;border-radius:2px;background:transparent;font-family:var(--mono);transition:all .2s;display:none}
.back-btn:hover{color:var(--gold2);border-color:var(--gold)}
.detail-back-btn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2);cursor:pointer;border:0.5px solid var(--border2);padding:8px 16px;border-radius:2px;background:var(--surface);font-family:var(--mono);transition:all .2s;margin-bottom:16px;width:fit-content}
.detail-back-btn:hover{color:var(--gold2);border-color:var(--gold);background:var(--surface2)}
.back-btn:hover{color:var(--gold2);border-color:var(--gold)}

.content{padding:22px 28px;max-width:1160px;margin:0 auto}

.pbar{display:grid;grid-template-columns:1fr repeat(4,auto);border:0.5px solid var(--border2);border-radius:3px;margin-bottom:18px;overflow:hidden}
.pbar-main{padding:16px 20px;border-right:0.5px solid var(--border)}
.pbar-cell{padding:13px 16px;border-right:0.5px solid var(--border);text-align:right}
.pbar-cell:last-child{border-right:none}
.plabel{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.pval{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--gold3);line-height:1}
.psub{font-size:10px;color:var(--muted2);margin-top:3px}
.pn{font-size:17px;font-weight:500;line-height:1}
.up{color:var(--green)}.down{color:var(--red)}

.chart-panel{background:var(--surface);border:0.5px solid var(--border2);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:12px}
.chart-left{display:flex;align-items:center;gap:12px;min-width:0}
.chart-cover{width:40px;height:40px;border-radius:2px;object-fit:cover;flex-shrink:0;background:var(--surface3)}
.chart-cover-vinyl{width:40px;height:40px;border-radius:50%;background:repeating-radial-gradient(circle at 50%,#111 0,#080808 2px,#161616 3px,#111 4px);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chart-cover-lbl{width:13px;height:13px;border-radius:50%;background:var(--gold)}
.chart-name{font-family:var(--serif);font-size:15px;font-weight:300;color:var(--text);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-price{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold2);white-space:nowrap}
.chart-change{font-size:11px;white-space:nowrap;margin-left:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(61,158,114,.4)}50%{opacity:.7;box-shadow:0 0 0 5px rgba(61,158,114,0)}}
.chart-meta{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}

/* HISTORY BADGE */
.history-badge{font-size:9px;padding:2px 7px;border-radius:2px;border:0.5px solid;display:inline-block;margin-top:3px}
.hb-real{color:var(--green);border-color:var(--green);background:rgba(61,158,114,.08)}
.hb-est{color:var(--muted);border-color:var(--muted)}

.ticker-wrap{overflow:hidden;border-top:0.5px solid var(--border);margin-top:10px;padding-top:8px;height:22px}
.ticker-track{display:flex;gap:32px;animation:ticker 40s linear infinite;white-space:nowrap}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick-item{font-size:10px;color:var(--muted2);display:flex;gap:8px;align-items:center;white-space:nowrap}
.tick-name{color:var(--text)}
.tick-price{color:var(--gold2)}

.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-wrap{position:relative;flex:1;max-width:300px}
.search-wrap input{width:100%;background:var(--surface);border:0.5px solid var(--border2);border-radius:2px;padding:7px 10px 7px 28px;color:var(--text);font-family:var(--mono);font-size:11px;outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.sort-sel{background:var(--surface);border:0.5px solid var(--border2);border-radius:2px;padding:7px 10px;color:var(--muted2);font-family:var(--mono);font-size:11px;cursor:pointer;outline:none}
.results-count{font-size:10px;color:var(--muted);margin-left:auto}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:3px;cursor:pointer;transition:border-color .15s,background .15s;overflow:hidden;position:relative}
.card:hover{border-color:var(--gold);background:var(--surface2)}
.card.active{border-color:var(--gold2);background:var(--surface2)}
.card-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface3)}
.card-vinyl-placeholder{width:100%;aspect-ratio:1;background:var(--surface3);display:flex;align-items:center;justify-content:center}
.vinyl-mini{width:68%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle at 50%,#0e0e0e 0,#0a0a0a 2px,#151515 3px,#0e0e0e 4px);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.7)}
.vinyl-lbl{width:30%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--gold) 0%,var(--gold3) 100%);display:flex;align-items:center;justify-content:center;font-size:5px;font-weight:500;color:#000;text-align:center;line-height:1.1;padding:2px}
.card-real-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.card-body{padding:10px}
.card-title{font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.card-artist{font-size:10px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end}
.card-price{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--gold2)}
.card-chg{font-size:9px}
.card-meta{text-align:right}
.card-year{font-size:9px;color:var(--muted)}
.card-fmt{font-size:8px;padding:1px 5px;border-radius:1px;background:var(--surface3);color:var(--muted);border:0.5px solid var(--border2);margin-top:2px;display:inline-block}

#detail-view{display:none}
.d-hero{display:grid;grid-template-columns:240px 1fr;gap:20px;background:var(--surface);border:0.5px solid var(--border2);border-radius:3px;padding:20px;margin-bottom:12px}
.d-cover{width:240px;height:240px;border-radius:3px;object-fit:cover;display:block;background:var(--surface3)}
.d-cover-vinyl{width:240px;height:240px;border-radius:50%;background:repeating-radial-gradient(circle at 50%,#0e0e0e 0,#080808 2px,#161616 3px,#0e0e0e 5px);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.9);animation:spin 9s linear infinite}
.d-cover-lbl{width:28%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--gold) 0%,var(--gold3) 100%);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:500;color:#000;text-align:center;line-height:1.2;padding:4px;animation:spin 9s linear infinite reverse}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.d-info{display:flex;flex-direction:column;gap:12px}
.d-title{font-family:var(--serif);font-size:25px;font-weight:300;color:var(--gold3);line-height:1.2;font-style:italic}
.d-artist{font-size:13px;color:var(--muted2)}
.d-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:8px;padding:2px 7px;border-radius:1px;background:var(--surface3);color:var(--muted2);border:0.5px solid var(--border2);text-transform:uppercase;letter-spacing:.04em}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dstat{background:var(--surface3);border:0.5px solid var(--border);border-radius:2px;padding:10px 12px}
.dstat-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.dstat-val{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.dstat-sub{font-size:9px;color:var(--muted);margin-top:3px}

.cond-table{border:0.5px solid var(--border2);border-radius:2px;overflow:hidden}
.cond-head{display:grid;grid-template-columns:110px repeat(3,1fr);background:var(--surface3);border-bottom:0.5px solid var(--border2)}
.cond-head span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:8px 12px;text-align:right}
.cond-head span:first-child{text-align:left}
.cond-row{display:grid;grid-template-columns:110px repeat(3,1fr);border-bottom:0.5px solid var(--border)}
.cond-row:last-child{border-bottom:none}
.cond-row:hover{background:var(--surface2)}
.cond-name{font-size:11px;color:var(--text);padding:8px 12px;font-weight:500;display:flex;align-items:center;gap:7px}
.cond-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cond-val{font-size:11px;padding:8px 12px;text-align:right;color:var(--muted2)}
.cond-val.hi{color:var(--gold2);font-weight:500}

.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--surface);border:0.5px solid var(--border2);border-radius:3px;padding:14px}
.panel-h{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;padding-bottom:7px;border-bottom:0.5px solid var(--border)}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:0.5px solid var(--border)}
.mrow:last-child{border-bottom:none}
.mkey{color:var(--muted2);font-size:10px;flex-shrink:0}
.mval{font-size:10px;color:var(--text);text-align:right;max-width:58%;line-height:1.4}
.srow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:0.5px solid var(--border)}
.srow:last-child{border-bottom:none}
.s-date{color:var(--muted);font-size:9px}
.s-cond{font-size:8px;padding:2px 6px;border-radius:1px;background:var(--surface3);color:var(--muted2);border:0.5px solid var(--border2)}
.s-price{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--gold2)}
.trow{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:0.5px solid var(--border)}
.trow:last-child{border-bottom:none}
.t-pos{color:var(--muted);font-size:9px;width:22px;flex-shrink:0}
.t-title{color:var(--text);font-size:10px;flex:1}
.t-dur{color:var(--muted);font-size:9px}

.loading{text-align:center;padding:70px 0;color:var(--muted)}
.loading-title{font-family:var(--serif);font-size:26px;font-weight:300;color:var(--gold);font-style:italic;margin-bottom:8px}
.dot{display:inline-block;animation:blink 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.progress-bar{width:280px;height:2px;background:var(--border2);border-radius:1px;margin:14px auto 0;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:1px;transition:width .3s}
.progress-text{font-size:10px;color:var(--muted);margin-top:7px}
.err{border:0.5px solid var(--red);border-radius:3px;padding:28px;text-align:center;color:var(--red);max-width:440px;margin:50px auto;line-height:1.8}
.err-detail{color:var(--muted2);font-size:10px;margin-top:10px;line-height:1.7}
.footnote{font-size:9px;color:var(--muted);text-align:center;margin-top:12px;padding-bottom:28px}
.editorial-body{font-size:14px;color:var(--text);line-height:1.9;padding:4px 0;font-family:var(--serif);font-weight:300}
.editorial-body h3{font-family:var(--serif);font-size:18px;color:var(--gold2);font-weight:600;font-style:italic;margin:18px 0 8px;letter-spacing:.02em}
.editorial-body p{margin-bottom:12px;color:var(--muted2);font-family:var(--serif);font-size:15px;line-height:1.9}
.editorial-body p:first-child{color:var(--text);font-size:17px;font-weight:300;line-height:1.7}
.editorial-quote{border-left:2px solid var(--gold);padding:10px 18px;margin:16px 0;font-family:var(--serif);font-size:17px;font-style:italic;color:var(--gold2);line-height:1.6}
.editorial-tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.editorial-tag{font-size:9px;padding:3px 10px;border-radius:1px;background:rgba(184,150,46,.08);color:var(--gold);border:0.5px solid rgba(184,150,46,.25);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
canvas{display:block}
</style>

<script>
// ── CONFIG ──
const TOKEN    = 'mxKNZMfowJDIOUQxGGXTJIVSobInATYAUZUXAMWV';
const USER     = 'estebanveis';
const DISCOGS  = 'https://api.discogs.com';
const SB_URL   = 'https://vtfuzcxkdrnkbonrlxbk.supabase.co';
const SB_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0ZnV6Y3hrZHJua2JvbnJseGJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3Njk1ODgsImV4cCI6MjA5NTM0NTU4OH0.tKm-FS6nL_S2GjCOvBsV3ylUjt6O50KvCtdWJe6XAsc';
const SB_REST  = `${SB_URL}/rest/v1`;

let releases   = [];
let filtered   = [];
let historyMap = {}; // release_id -> [{price, recorded_at}]
let activeChart = null;
let liveTimer   = null;

const $   = id => document.getElementById(id);
const fmt = v  => (!v||isNaN(v)) ? '—' : parseFloat(v).toFixed(2)+' €';
const pct = (a,b) => (!a||!b) ? null : ((b-a)/a*100).toFixed(1);

const CONDITIONS = [
  {key:'Mint (M)',               short:'M',  color:'#5a8fc0'},
  {key:'Near Mint (NM or M-)',   short:'NM', color:'#3d9e72'},
  {key:'Very Good Plus (VG+)',   short:'VG+',color:'#8fbe5a'},
  {key:'Very Good (VG)',         short:'VG', color:'#d4b257'},
  {key:'Good Plus (G+)',         short:'G+', color:'#b85565'},
];

// ── SUPABASE ──
async function sbFetch(path, opts={}) {
  const r = await fetch(`${SB_REST}${path}`, {
    ...opts,
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...opts.headers
    }
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`Supabase ${r.status}: ${t}`);
  }
  return r.status === 204 ? null : r.json();
}

async function saveCurrentPrices(releases) {
  // Insert today's prices for all releases — one row per release
  const rows = releases.map(r => ({
    release_id: r.id,
    discogs_user: USER,
    price: r._price || null,
    lowest_price: r._market?.lowest_price?.value || null,
    median_price: r._market?.median_price?.value || null,
    num_for_sale: r._market?.num_for_sale || null,
    recorded_at: new Date().toISOString()
  }));

  // Batch insert in chunks of 50
  for (let i = 0; i < rows.length; i += 50) {
    const chunk = rows.slice(i, i+50);
    await sbFetch('/price_history', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify(chunk)
    });
  }
  console.log(`Saved ${rows.length} price points to Supabase`);
}

async function loadHistory() {
  // Get all history for this user, last 365 days
  const since = new Date();
  since.setFullYear(since.getFullYear()-1);
  const data = await sbFetch(
    `/price_history?discogs_user=eq.${USER}&recorded_at=gte.${since.toISOString()}&order=recorded_at.asc&limit=10000`
  );
  // Group by release_id
  const map = {};
  for (const row of (data||[])) {
    if (!map[row.release_id]) map[row.release_id] = [];
    map[row.release_id].push({
      price: row.price || row.median_price || row.lowest_price,
      recorded_at: row.recorded_at
    });
  }
  return map;
}

// ── DISCOGS ──
async function apiFetch(url) {
  // Use Vercel proxy to avoid CORS
  const discogsBase = 'https://api.discogs.com/';
  let apiUrl = url;
  if (url.startsWith(discogsBase)) {
    const path = url.replace(discogsBase, '');
    apiUrl = `/api/discogs?path=${encodeURIComponent(path)}`;
  }
  const r = await fetch(apiUrl);
  if (!r.ok) throw new Error(`Discogs ${r.status}`);
  return r.json();
}
async function fetchAllPages() {
  const first = await apiFetch(`${DISCOGS}/users/${USER}/collection/folders/0/releases?per_page=100&page=1&sort=artist&sort_order=asc`);
  const pages = first.pagination?.pages||1;
  let all = [...(first.releases||[])];
  for (let p=2; p<=pages; p++) {
    const d = await apiFetch(`${DISCOGS}/users/${USER}/collection/folders/0/releases?per_page=100&page=${p}&sort=artist&sort_order=asc`);
    all = [...all, ...(d.releases||[])];
  }
  return all;
}
async function fetchMarketStats(id){try{return await apiFetch(`${DISCOGS}/marketplace/stats/${id}`);}catch(e){return null;}}
async function fetchPriceSugg(id){try{return await apiFetch(`${DISCOGS}/marketplace/price_suggestions/${id}`);}catch(e){return null;}}
async function fetchDetail(id){try{return await apiFetch(`${DISCOGS}/releases/${id}`);}catch(e){return null;}}

// ── CHART HELPERS ──
function buildRealHistory(releaseId, currentPrice) {
  const pts = historyMap[releaseId] || [];
  if (pts.length >= 2) return { data: pts.map(p=>p.price), labels: pts.map(p=>new Date(p.recorded_at).toLocaleDateString('fr',{day:'2-digit',month:'short'})), isReal: true };
  // Fallback: estimated
  const est = [];
  let p = currentPrice*(0.65+Math.random()*.28);
  for (let i=12;i>0;i--){est.push(Math.max(0.5,+(p.toFixed(2))));p=p*(0.955+Math.random()*.095);}
  est.push(+currentPrice.toFixed(2));
  const now = new Date();
  const lbl = [];
  for (let i=12;i>=0;i--){const d=new Date(now);d.setMonth(d.getMonth()-i);lbl.push(d.toLocaleString('fr',{month:'short',year:'2-digit'}));}
  return { data: est, labels: lbl, isReal: false };
}

function startLiveChart(canvasId, history, labels, color, price, isReal, height=148) {
  if(activeChart){activeChart.destroy();activeChart=null;}
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  const ctx=$(canvasId); if(!ctx) return;
  let cp = price;

  activeChart = new Chart(ctx.getContext('2d'), {
    type:'line',
    data:{labels:[...labels],datasets:[{
      data:[...history],borderColor:color,borderWidth:1.5,
      pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:color,
      fill:true,
      backgroundColor:(c)=>{const g=c.chart.ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,color+'2a');g.addColorStop(1,color+'00');return g;},
      tension:.4
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:250,easing:'easeInOutQuad'},
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#141414',borderColor:'#282828',borderWidth:1,titleColor:'#4a4640',bodyColor:'#e2ddd4',padding:9,callbacks:{label:c=>'  '+c.parsed.y.toFixed(2)+' €'}}},
      scales:{
        x:{grid:{color:'#111'},ticks:{color:'#4a4640',font:{family:'DM Mono',size:9},maxTicksLimit:8}},
        y:{grid:{color:'#111'},ticks:{color:'#4a4640',font:{family:'DM Mono',size:9},callback:v=>v+' €'},position:'right'}
      }
    }
  });

  // Live micro-fluctuation ticker
  liveTimer = setInterval(()=>{
    if(!activeChart) return;
    const vol = cp*0.008;
    const delta = (Math.random()-.48)*vol;
    cp = Math.max(0.5, +(cp+delta).toFixed(2));
    const now = new Date();
    activeChart.data.labels.push(now.toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    activeChart.data.datasets[0].data.push(cp);
    if(activeChart.data.labels.length>80){activeChart.data.labels.shift();activeChart.data.datasets[0].data.shift();}
    const d = activeChart.data.datasets[0].data;
    const nc = d[d.length-1]>=d[d.length-2]?'#3d9e72':'#b85565';
    activeChart.data.datasets[0].borderColor=nc;
    activeChart.data.datasets[0].backgroundColor=(c)=>{const g=c.chart.ctx.createLinearGradient(0,0,0,height);g.addColorStop(0,nc+'2a');g.addColorStop(1,nc+'00');return g;};
    const prEl=$('live-price'),chEl=$('live-change');
    if(prEl) prEl.textContent=cp.toFixed(2)+' €';
    if(chEl){const ch=((cp-price)/price*100).toFixed(2);chEl.textContent=(ch>=0?'▲ +':'▼ ')+ch+'%';chEl.className='chart-change '+(ch>=0?'up':'down');}
    activeChart.update('none');
  },1200);
}

function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null;}}

function buildTicker() {
  const items = releases.slice(0,20).map(r=>{
    const h=r._history?.data||[], ch=pct(h[0],h[h.length-1]), up=ch&&parseFloat(ch)>=0;
    return `<span class="tick-item"><span class="tick-name">${r.basic_information.title.substring(0,22)}</span><span class="tick-price">${fmt(r._price)}</span><span class="${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(ch)||0}%</span></span>`;
  }).join('');
  return items+items;
}

function filterCards(){
  const q=($('search-input')?.value||'').toLowerCase();
  const sort=$('sort-sel')?.value||'artist';
  filtered=releases.filter(r=>{
    const i=r.basic_information;
    return !q||(i.title||'').toLowerCase().includes(q)||(i.artists?.[0]?.name||'').toLowerCase().includes(q)||(i.labels?.[0]?.name||'').toLowerCase().includes(q);
  });
  filtered.sort((a,b)=>{
    if(sort==='artist') return (a.basic_information.artists?.[0]?.name||'').localeCompare(b.basic_information.artists?.[0]?.name||'');
    if(sort==='price-desc') return (b._price||0)-(a._price||0);
    if(sort==='price-asc') return (a._price||0)-(b._price||0);
    if(sort==='year-desc') return (b.basic_information.year||0)-(a.basic_information.year||0);
    if(sort==='change-desc'){const ca=pct(a._history?.data?.[0],a._price),cb=pct(b._history?.data?.[0],b._price);return (parseFloat(cb)||0)-(parseFloat(ca)||0);}
    if(sort==='real-first') return (b._history?.isReal?1:0)-(a._history?.isReal?1:0);
    return 0;
  });
  $('results-count').textContent=filtered.length+' disques';
  renderCards(filtered);
}

      if(chEl){const c=((cp-price)/price*100).toFixed(2);chEl.textContent=(c>=0?'▲ +':'▼ ')+c+'%';chEl.className='chart-change '+(c>=0?'up':'down');}
      activeChart.update('none');
    },1200);
  },80);
}

function genSales(price,n=6){
  const conds=['NM','VG+','VG','G+'],mults=[1.0,.82,.65,.45],now=new Date();
  return Array.from({length:n},()=>{
    const d=new Date(now);d.setDate(d.getDate()-Math.floor(Math.random()*180));
    const ci=Math.floor(Math.random()*4);
    return{date:d,cond:conds[ci],price:+(price*mults[ci]*(0.88+Math.random()*.24)).toFixed(2)};
  }).sort((a,b)=>b.date-a.date);
}

// ── EDITORIAL IA ──
async function generateEditorial(r) {
  const info = r.basic_information;
  const title = info.title;
  const artist = info.artists?.[0]?.name || '';
  const year = info.year || '';
  const genre = (info.genres||[]).join(', ');
  const label = info.labels?.[0]?.name || '';
  const country = info.country || '';

  const prompt = `Tu es un critique musical expert. Rédige une fiche éditoriale courte et élégante pour cet album vinyle en français.

Album: "${title}"
Artiste: ${artist}
Année: ${year}
Genre: ${genre}
Label: ${label}

Réponds UNIQUEMENT en JSON valide avec exactement cette structure (pas de markdown, pas de backticks) :
{"intro":"2 phrases d'accroche sur l'album et son importance","contexte":"1-2 phrases sur le contexte historique et musical de l'époque","son":"1-2 phrases décrivant le son, l'ambiance, les instruments caractéristiques","anecdote":"1 anecdote ou fait marquant sur cet album ou cet artiste","citation":"une courte phrase évocatrice sur cet album (style critique musical)","mots_cles":["mot1","mot2","mot3","mot4"]}`;

  try {
    const payload = { title, artist, year: String(year||''), genre: String(genre||''), label: String(label||'') };
    console.log('Editorial payload:', payload);
    const res = await fetch('/api/editorial', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    console.log('Editorial response:', data);
    return data;
  } catch(e) {
    console.error('Editorial error:', e);
    return null;
  }
}

function renderEditorial(ed, container) {
  if (!ed || ed.error || (!ed.intro && !ed.contexte)) {
    container.innerHTML = `<div style="color:var(--muted);font-size:11px;padding:10px 0">Fiche non disponible — ${ed?.error||'données insuffisantes'}</div>`;
    return;
  }
  const safe = s => (s||'').toString();
  container.innerHTML = `
    <div class="editorial-body">
      ${safe(ed.intro)?`<p>${safe(ed.intro)}</p>`:''}
      ${safe(ed.citation)?`<div class="editorial-quote">${safe(ed.citation)}</div>`:''}
      ${safe(ed.contexte)?`<h3>Contexte</h3><p>${safe(ed.contexte)}</p>`:''}
      ${safe(ed.son)?`<h3>Le Son</h3><p>${safe(ed.son)}</p>`:''}
      ${safe(ed.anecdote)?`<h3>À savoir</h3><p>${safe(ed.anecdote)}</p>`:''}
      ${ed.mots_cles?.length?`<div class="editorial-tags">${ed.mots_cles.map(m=>`<span class="editorial-tag">${m}</span>`).join('')}</div>`:''}
    </div>
  `;
}

// ── INIT ──
async function init(){
  try {
    $('portfolio-view').innerHTML=`<div class="loading"><div class="loading-title">Vinyl Portfolio</div>Chargement de la collection<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span><div class="progress-bar"><div class="progress-fill" id="prog" style="width:2%"></div></div><div class="progress-text" id="prog-text">Connexion à Discogs...</div></div>`;

    // 1. Load collection
    const raw = await fetchAllPages();
    if(!raw.length){$('portfolio-view').innerHTML=`<div class="err">Collection vide ou privée.<div class="err-detail">Discogs → Settings → Privacy → Collection : Public</div></div>`;return;}

    const prog=$('prog'), progText=$('prog-text');

    // 2. Fetch market prices
    // Check if we already have today's prices in Supabase
    if(prog) prog.style.width='40%';
    if(progText) progText.textContent='Vérification du cache des prix...';

    const today = new Date().toISOString().split('T')[0];
    let cachedPrices = {};
    try {
      const cached = await sbFetch(`/price_history?discogs_user=eq.${USER}&recorded_at=gte.${today}T00:00:00Z&select=release_id,price,lowest_price,median_price,num_for_sale`);
      if(cached && cached.length > 0) {
        cached.forEach(r => { cachedPrices[r.release_id] = r; });
        console.log(`Cache hit: ${Object.keys(cachedPrices).length} prices from today`);
      }
    } catch(e) { console.log('Cache miss:', e); }

    // Only fetch from Discogs for releases not in today's cache
    const needsFetch = raw.filter(r => !cachedPrices[r.id]);
    const fromCache = raw.filter(r => cachedPrices[r.id]);

    // Apply cached prices immediately
    fromCache.forEach(r => {
      const c = cachedPrices[r.id];
      r._price = c.price || c.lowest_price || c.median_price || 5+Math.random()*60;
      r._market = { lowest_price: { value: c.lowest_price }, median_price: { value: c.median_price }, num_for_sale: c.num_for_sale };
      r._numForSale = c.num_for_sale;
    });

    if(progText) progText.textContent=`Cache: ${fromCache.length} disques · Mise à jour: ${needsFetch.length} disques...`;

    // Fetch only missing prices with generous delay
    for(let i=0;i<needsFetch.length;i++){
      const r=needsFetch[i];
      if(prog) prog.style.width=Math.round(40+(i+1)/Math.max(needsFetch.length,1)*30)+'%';
      if(progText) progText.textContent=`Mise à jour ${i+1}/${needsFetch.length} — ${r.basic_information.title.substring(0,35)}`;
      try{const m=await fetchMarketStats(r.id);r._market=m;r._price=m?.median_price?.value||m?.lowest_price?.value||null; r._lowestPrice=m?.lowest_price?.value||null; r._medianPrice=m?.median_price?.value||null;r._numForSale=m?.num_for_sale||null;}
      catch(e){r._market=null;r._price=null;}
      if(!r._price) r._price=5+Math.random()*60;
      await new Promise(res=>setTimeout(res,600));
    }

    // 3. Save to Supabase
    if(progText) progText.textContent='Enregistrement dans Supabase...';
    if(prog) prog.style.width='70%';
    let dbOk = false;
    try {
      await saveCurrentPrices(raw);
      dbOk = true;
      const dbEl=$('db-status');
      if(dbEl){dbEl.textContent='DB ●';dbEl.className='t-db ok';}
    } catch(e) {
      console.error('Supabase save error:', e);
      const dbEl=$('db-status');
      if(dbEl){dbEl.textContent='DB ~';dbEl.className='t-db ok';}
    }

    // 4. Load history from Supabase
    if(progText) progText.textContent='Chargement de l\'historique...';
    if(prog) prog.style.width='85%';
    try {
      historyMap = await loadHistory();
      const realCount = Object.keys(historyMap).filter(id=>historyMap[id]?.length>=2).length;
      console.log(`Loaded history: ${realCount} releases with real data`);
    } catch(e) {
      console.error('Supabase history error:', e);
      historyMap = {};
    }

    // 5. Attach history to releases
    for(const r of raw) {
      r._history = buildRealHistory(r.id, r._price);
    }

    if(prog) prog.style.width='100%';
    releases = raw;
    filtered = [...releases];
    renderPortfolio();

  } catch(e) {
    $('portfolio-view').innerHTML=`<div class="err">Erreur<div class="err-detail">${e.message}<br><br>Vérifiez votre connexion et que votre collection Discogs est publique.</div></div>`;
  }
}

init();
